name: Release & Multi-Arch Build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: akkunyo/sm-node
  SING_BOX_VERSION: "1.14.2"

jobs:
  # 0. Node and controller share one version: the tag must be v<package.json version>
  version:
    name: Verify Tag Matches package.json
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Check tag against package.json
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # 1. Compile self-contained sm-node multi-arch binaries (with embedded sing-box)
  build-agent-binaries:
    name: Build & Release Node Binaries
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: agent/go.sum

      - name: Compile sing-box core and embed into sm-node
        run: |
          mkdir -p dist/amd64 dist/arm64 release-assets
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X 'main.Version=${{ needs.version.outputs.version }}' -X 'main.GitCommit=${{ github.sha }}' -X 'main.BuildTime=${BUILD_TIME}'"

          echo "--> Cloning sing-box v${SING_BOX_VERSION}..."
          git clone --depth 1 --branch "v${SING_BOX_VERSION}" https://github.com/sagernet/sing-box.git /tmp/sing-box-src

          for arch in amd64 arm64; do
            echo "--> Compiling sing-box core for linux/${arch}..."
            (cd /tmp/sing-box-src && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -buildid=" -tags "with_quic,with_utls,with_clash_api,with_v2ray_api" -o "/tmp/sing-box-${arch}" ./cmd/sing-box)

            echo "--> Embedding sing-box into sm-node for linux/${arch}..."
            gzip -c "/tmp/sing-box-${arch}" > agent/sing-box.gz
            (cd agent && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="${LDFLAGS}" -o "../dist/${arch}/sm-node" .)

            tar -czf "release-assets/sm-node-linux-${arch}.tar.gz" -C "dist/${arch}" sm-node
          done

          cd release-assets && sha256sum sm-node-linux-amd64.tar.gz sm-node-linux-arm64.tar.gz > sha256sums.txt

      - name: Upload pre-built binaries for container build
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-dist
          path: dist/
          retention-days: 1

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/sm-node-linux-amd64.tar.gz
            release-assets/sm-node-linux-arm64.tar.gz
            release-assets/sha256sums.txt
          name: SM-UI Worker ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

  # 2. Package and publish multi-arch sm-node docker image (seconds, no QEMU emulation)
  publish-container:
    name: Build & Publish Node Container
    needs: [version, build-agent-binaries]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          name: prebuilt-dist
          path: dist/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
